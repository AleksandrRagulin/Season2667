name: Sync live scores

on:
  schedule:
    # Every 10 minutes, offset from the hour — GitHub explicitly recommends
    # avoiding round numbers (":00, :10, ...") since everyone's schedules
    # pile up there, making silent drops under load more likely.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --omit=dev

      - run: npm run sync-scores
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
